
name: Xcode - Build and Analyze

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build and Analyze EaseCalculator
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcodebuild -list -project EaseCalculator.xcodeproj

      - name: Diagnose Build Settings
        run: |
          xcodebuild \
            -project EaseCalculator.xcodeproj \
            -scheme EaseCalculator \
            -showBuildSettings \
            | grep -E 'PRODUCT_NAME =|TARGET_NAME =|FULL_PRODUCT_NAME =|CONFIGURATION ='

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project EaseCalculator.xcodeproj \
            -scheme EaseCalculator \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            PRODUCT_NAME=EaseCalculator \
            clean build \
            2>&1 | tee "$RUNNER_TEMP/xcode-build.log"

      - name: Analyze
        run: |
          set -o pipefail
          xcodebuild \
            -project EaseCalculator.xcodeproj \
            -scheme EaseCalculator \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            PRODUCT_NAME=EaseCalculator \
            analyze \
            2>&1 | tee "$RUNNER_TEMP/xcode-analyze.log"

      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-logs
          path: ${{ runner.temp }}/xcode-*.log
          if-no-files-found: ignore
